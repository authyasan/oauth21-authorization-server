services:
  postgres:
    image: postgres:16-alpine
    container_name: oauth21-postgres
    environment:
      POSTGRES_DB: oauth21
      POSTGRES_USER: oauth21
      POSTGRES_PASSWORD: oauth21_dev_password
    ports:
      # [SECURITY] 固定の開発用認証情報を使うDBは、ホスト自身からの接続に限定する。
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
